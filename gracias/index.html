.thanks-page{min-height:100svh;display:grid;place-items:center;padding:32px 24px;background:var(--paper,#f7f5ef)}
.thanks-card{width:min(100%,760px);text-align:center;padding:clamp(32px,6vw,72px);border:1px solid #789b4c55;border-radius:28px}

.thanks-card h1 em{color:#789b4c}.thanks-card p{max-width:490px;margin:0 auto 28px;line-height:1.7}

[data-theme="dark"] .thanks-logo{filter:grayscale(1) brightness(0) invert(1)}

.thanks-page{position:relative;isolation:isolate;overflow:hidden;background:#10180f}
.thanks-page::before{content:"";position:absolute;z-index:-2;inset:-4%;background:url("/assets/img/welcome-network.jpg") center/cover no-repeat;opacity:.8;animation:thanks-depth 24s ease-in-out infinite alternate;pointer-events:none}
.thanks-page::after{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at center,rgba(16,24,15,.1),rgba(10,17,12,.65));pointer-events:none}
.thanks-card{background:rgba(247,245,239,.96);color:#14150f;border-color:rgba(178,201,143,.5);box-shadow:0 28px 90px rgba(0,0,0,.25);backdrop-filter:blur(8px)}
.thanks-card h1 em,.thanks-label{color:#4c6531}
[data-theme="dark"] .thanks-card{background:rgba(20,30,22,.95);color:#f7f5ef}
[data-theme="dark"] .thanks-card h1 em,[data-theme="dark"] .thanks-label{color:#b2c98f}

@media(max-width:600px){.thanks-page{padding:28px 18px}.thanks-card{padding:36px 20px}.thanks-logo{margin-bottom:28px}.thanks-card h1{font-size:clamp(2.35rem,10vw,3.5rem)}}
